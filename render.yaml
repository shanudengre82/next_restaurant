services:
  - type: web
    name: next-restaurant
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: >-
      mkdir -p .streamlit &&
      cp /etc/secrets/secrets.toml .streamlit/secrets.toml &&
      streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONPATH
        value: src
